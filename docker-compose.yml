name: tams

# Three services, as decided in deployment-decision.md section 4. The same file
# runs on the VPS and on a laptop for the defense-day fallback (section 14).

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tams}
      POSTGRES_USER: ${POSTGRES_USER:-tams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    # No published port: PostgreSQL is reachable from the api service only (PRD 6.1).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tams} -d ${POSTGRES_DB:-tams}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    environment:
      ConnectionStrings__Default: >-
        Host=db;Port=5432;Database=${POSTGRES_DB:-tams};Username=${POSTGRES_USER:-tams};Password=${POSTGRES_PASSWORD}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Jwt__Key: ${JWT_KEY:-}
      Bootstrap__AdminEmail: ${BOOTSTRAP_ADMIN_EMAIL:-}
      Bootstrap__AdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      # Comma-separated browser origins allowed to call the API (the front end). On the VPS set the real domain.
      Cors__Origins: ${CORS_ORIGINS:-http://localhost:5173}
      # Development only: load the sample data from docs/TEST-DATA.md into an empty database.
      Seed__Demo: ${SEED_DEMO:-false}
      Backup__StatusPath: /app/backup-status/backup.json
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Kiosk photos, report PDFs and QR sheets (PRD 6.1 file storage).
      - media:/app/media
      # ASP.NET Data Protection key ring (encrypts fingerprint templates). Lose it, lose the templates.
      - dp-keys:/app/keys
      # Written by the backup service; /health reports a failed or stale backup from it.
      - backup-status:/app/backup-status:ro
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      TAMS_DOMAIN: ${TAMS_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped

  # Nightly encrypted pg_dump (docs/RUNBOOK.md). Only the age PUBLIC key lives here; keep the private key
  # off the server. Leave AGE_RECIPIENT empty and the job records a failure instead of writing a plain dump.
  backup:
    build: ./backup
    environment:
      TZ: Asia/Manila
      POSTGRES_DB: ${POSTGRES_DB:-tams}
      POSTGRES_USER: ${POSTGRES_USER:-tams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AGE_RECIPIENT: ${AGE_RECIPIENT:-}
      BACKUP_HOUR: ${BACKUP_HOUR:-02}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${S3_REGION:-auto}
    volumes:
      - backups:/backups
      - dp-keys:/keys
      - backup-status:/status
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backups:
  backup-status:
  db-data:
  media:
  dp-keys:
  caddy-data:
  caddy-config:
